# ──────────────────────────────────────────────────────────────────────────────
# Release workflow — triggered by pushing a version tag (e.g. v0.1.2)
#
# FIRST-TIME SETUP (do this once before the first run):
#
#   1. Create a GitHub environment called "release":
#      Repo → Settings → Environments → New environment → name it "release"
#      (Optional) add a protection rule requiring manual approval before publish.
#
#   2. Register a Trusted Publisher on PyPI (no API token needed):
#      pypi.org → Your project → Manage → Publishing → Add a publisher
#        Publisher:       GitHub Actions
#        Owner:           <your GitHub username>
#        Repository:      <your repo name>
#        Workflow name:   release.yml
#        Environment:     release
#
#   3. That's it — no secrets to store anywhere.
#
# HOW TO RELEASE:
#   git tag -a v0.1.2 -m "Release 0.1.2"
#   git push origin v0.1.2
# ──────────────────────────────────────────────────────────────────────────────

name: Release to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write   # needed to create GitHub Releases
  id-token: write   # needed for OIDC trusted-publisher upload to PyPI

jobs:
  # ── 1. Test ────────────────────────────────────────────────────────────────
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Cache the downloaded HuggingFace model so subsequent runs are fast.
      # The cache key is fixed to the model name — invalidate it manually
      # if you ever change the default model.
      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-promptguard-distilbert-v1

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint — black
        run: black --check promptguard tests

      - name: Lint — flake8
        run: flake8 promptguard tests

      - name: Type-check — mypy
        run: mypy promptguard

      - name: Run tests
        run: pytest

  # ── 2. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Verify the tag version matches what's declared in pyproject.toml.
      # Catches the "forgot to bump the version" mistake before any upload.
      - name: Check version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(python - <<'PYEOF'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PYEOF
          )
          echo "Tag version:  $TAG_VERSION"
          echo "File version: $FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($FILE_VERSION)"
            exit 1
          fi

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      # Pass the built files to the publish and release jobs.
      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── 3. Publish to PyPI ─────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: release   # maps to the Trusted Publisher environment on PyPI

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No username/password needed — OIDC trusted publisher handles auth.

  # ── 4. Create GitHub Release ───────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Extract the changelog section for this version to use as release notes.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python - "$VERSION" <<'PYEOF'
          import re, sys

          version = sys.argv[1]
          text = open("CHANGELOG.md").read()

          # Match the block starting with ## [VERSION] up to (but not including)
          # the next ## [ heading or end of file.
          pattern = rf"(## \[{re.escape(version)}\][^\n]*\n)(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, text, re.DOTALL)

          notes = match.group(0).strip() if match else f"Release {version} — see CHANGELOG.md for details."
          with open("release_notes.txt", "w") as f:
              f.write(notes)
          print(f"Extracted {len(notes)} characters of release notes")
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ github.ref_name }}"
          body_path: release_notes.txt
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
