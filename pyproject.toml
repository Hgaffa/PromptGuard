[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptguard"
version = "0.1.0"
description = "A production-ready library for detecting malicious LLM prompts and prompt injection attacks"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["prompt-injection", "llm-security", "ai-safety", "nlp"]
authors = [
    {name = "Hasanain Ghafoor", email = "hgaffa@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/Hgaffa/promptguard"
Documentation = "https://github.com/Hgaffa/promptguard#readme"
Repository = "https://github.com/Hgaffa/promptguard"
"Bug Tracker" = "https://github.com/Hgaffa/promptguard/issues"