[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptguard-ml"
version = "0.1.1"
description = "A production-ready library for detecting malicious LLM prompts and prompt injection attacks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["prompt-injection", "llm-security", "ai-safety", "nlp"]
authors = [
    {name = "Hasanain Ghafoor", email = "hgaffa@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.8.1",
]
full = [
    "spacy>=3.8.1",
    "pandas>=1.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=7.3.0",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=3.0.0",
    "sphinx-design>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["promptguard*"]

[tool.setuptools.package-data]
promptguard = ["py.typed", "*.pyi"]

[project.urls]
Homepage = "https://github.com/Hgaffa/promptguard"
Documentation = "https://hgaffa.github.io/promptguard/"
Repository = "https://github.com/Hgaffa/promptguard"
"Bug Tracker" = "https://github.com/Hgaffa/promptguard/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=promptguard",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=85"
]

[tool.coverage.run]
source = ["promptguard"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "vaderSentiment.*",
    "spacy.*",
    "tqdm.*",
    "pandas.*",
]
ignore_missing_imports = true